[package]
name = "flowing-thoughts"
version = "0.4.0"
description = "Voice dictation for macOS — hold to record, release to type"
authors = ["Joost Dolstra"]
edition = "2021"

[lib]
name = "flowing_thoughts_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["private-tcc"]
# Best-effort System Audio permission preflight through the private TCC
# framework (loaded with dlopen). Builds without it rely on the zero-audio
# watchdog alone. Used by meetings/capture/permission.rs.
private-tcc = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["multipart", "json", "stream"] }
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
hound = "3.5"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tauri-plugin-updater = "2"
whisper-rs = { version = "0.16", features = ["metal"] }
# Parakeet TDT via ONNX Runtime. Only the `onnx` engines — Whisper stays on
# our own whisper-rs so there is a single copy of whisper.cpp in the binary.
transcribe-rs = { version = "0.3.11", default-features = false, features = ["onnx"] }
futures = "0.3"
futures-util = "0.3"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
# Meetings (added up front by WP1 so later packages never edit this file).
# Capture-time resampling to 16 kHz mono, and the lock-free ring between the
# audio callbacks and the chunk-writer threads.
rubato = "5"
rtrb = "0.4"

[target.'cfg(not(target_os = "macos"))'.dependencies]
rdev = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-foundation-sys = "0.8"
core-graphics = "0.23"
# Meetings: Core Audio process taps (system audio). The tap symbols are
# resolved with dlsym at runtime, never linked, so the app still launches on
# macOS 12/13. cpal stays at 0.15 — 0.17+ hard-links them.
objc2 = "0.6"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
