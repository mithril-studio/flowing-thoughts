name: Apple credentials
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apple-credentials.yml'
      - '.github/workflows/release.yml'
      - 'scripts/check-apple-credentials.sh'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          fetch-depth: 0
      - name: Require trusted code before exposing Apple secrets
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Validate certificate and notarization authentication (no build or publish)
        run: bash scripts/check-apple-credentials.sh
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Joost Dolstra (3P87HV73Y6)"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
