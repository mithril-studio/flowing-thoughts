name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@c655e6902480079b4f4726174674b33218ce239c # 1.93.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      # Existing formatting debt belongs in a separate cleanup PR. Enforce
      # formatting on changed Rust files without pulling that cleanup into releases.
      - name: Check formatting of changed Rust files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASE="$BASE_SHA"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE="$(git rev-parse HEAD^)"
          fi
          git diff --name-only --diff-filter=ACMR -z "$BASE" HEAD -- '*.rs' > "$RUNNER_TEMP/changed-rust"
          while IFS= read -r -d '' FILE; do
            rustfmt --edition 2021 --config skip_children=true --check "$FILE"
          done < "$RUNNER_TEMP/changed-rust"
      - run: cargo check --locked
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
