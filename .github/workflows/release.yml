name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
# Serialize all releases, not just runs of the same tag. Never cancel a publish.
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  preflight:
    uses: ./.github/workflows/apple-credentials.yml
    secrets: inherit
  build-and-publish:
    needs: preflight
    runs-on: macos-14
    timeout-minutes: 45
    env:
      APPLE_SIGNING_IDENTITY: "Developer ID Application: Joost Dolstra (3P87HV73Y6)"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release provenance and versions
        run: |
          test "$(uname -m)" = arm64
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/check-release-version.py "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: brew install minisign
      - name: Write signing keys
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/ft-signing"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/ft-signing/updater.key"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/ft-signing/AuthKey.p8"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      - name: Build, notarize, verify and publish
        env:
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ runner.temp }}/ft-signing/updater.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_PATH: ${{ runner.temp }}/ft-signing/AuthKey.p8
          NOTARY_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: bash scripts/release.sh "Automated release ${GITHUB_REF_NAME} from $(git rev-parse HEAD)"
      - name: Remove signing keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/ft-signing"
